name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Cooklang CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo cooklang/CookCLI --pattern 'cook-*-linux-x86_64-gnu.tar.gz' --output - | tar xz
          sudo mv cook /usr/local/bin/
          cook --version

      - name: Build site
        run: ./scripts/build-site.rb

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: ${{ failure() }}
    steps:
      - name: Send Pushover notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          curl -s \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Recipes deploy failed" \
            --form-string "message=${COMMIT_MSG%%$'\n'*}" \
            --form-string "url=$RUN_URL" \
            --form-string "url_title=View run" \
            --form-string "priority=0" \
            https://api.pushover.net/1/messages.json

  notify-success:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ success() && github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Pushover notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          COMMITS_JSON: ${{ toJSON(github.event.commits.*.message) }}
          ADDED_JSON: ${{ toJSON(github.event.commits.*.added) }}
        run: |
          # First line of each deployed commit message, truncated to Pushover's 1024-char limit
          message=$(echo "$COMMITS_JSON" | jq -r '.[] | "• " + split("\n")[0]' | head -c 1000)

          # Link to the most recently added recipe that still exists, otherwise the site
          url="$SITE_URL"
          url_title="Open site"
          for file in $(echo "$ADDED_JSON" | jq -r 'flatten | map(select(test("^recipes/[^/]+\\.cook$"))) | reverse | .[]'); do
            [ -f "$file" ] || continue
            slug=$(basename "$file" .cook)
            title=$(sed -n 's/^title: *//p' "$file" | head -1)
            url="${SITE_URL%/}/$slug.html"
            url_title="Open ${title:-$slug}"
            break
          done

          curl -s \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Recipes deployed" \
            --form-string "message=$message" \
            --form-string "url=$url" \
            --form-string "url_title=$url_title" \
            https://api.pushover.net/1/messages.json
